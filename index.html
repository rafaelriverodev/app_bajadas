<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Politica de Seguridad de Contenido (CSP) para prevenir ataques XSS -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;">
    <title>Capturador de Códigos de Barra</title>
    
    <!-- Hoja de estilos principal -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- Libreria externa segura para escaneo de codigos de barra -->
    <script src="https://unpkg.com/html5-qrcode" defer></script>

    <!-- Librerias externas seguras para la generacion de archivos PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js" defer></script>
    <script src="js/barcode_parser.js" defer></script>
    
    <script src="js/scanner_service.js" defer></script>
    <script src="js/pdf_generator.js" defer></script>
    <script src="js/app.js" defer></script>
    <!-- Script principal de la aplicacion -->
    <script src="js/app.js" defer></script>
</head>
<body>

    <!-- Encabezado principal de la aplicacion -->
    <header class="header_principal">
        <h1>Escáner de Productos</h1>
    </header>

    <!-- Contenedor principal de la interfaz -->
    <main class="contenedor_principal">

        <!-- Seccion para el visor de la camara -->
        <section class="seccion_escaner">
            <h2>Lector de Código</h2>
            
            <div id="lector_camara" class="caja_camara"></div>

            <button id="boton_iniciar_camara" class="boton_primario">
                Activar Cámara
            </button>

            <button id="boton_detener_camara" class="boton_secundario" style="display: none;">
                Detener Cámara
            </button>
        </section>

        <!-- Seccion del formulario para ingreso y confirmacion de datos -->
        <section class="seccion_formulario">
            <h2>Datos del Producto Escaneado</h2>

            <form id="formulario_producto" class="form_producto">

                <div class="grupo_input">
            <label for="numero_empleado">Número de Empleado:</label>
            <input type="text" id="numero_empleado" name="numero_empleado" required placeholder="Ej: 00811329">
                </div>

                <div class="grupo_input">
                    <label for="codigo_procesado">Código Capturado:</label>
                    <input type="text" id="codigo_procesado" name="codigo_procesado" readonly required placeholder="Esperando lectura...">
                </div>

                <div class="grupo_input">
                    <label for="nombre_producto">Nombre del Producto:</label>
                    <input type="text" id="nombre_producto" name="nombre_producto" required placeholder="Ej: Queso Gouda">
                </div>

                <div class="grupo_input">
                    <label for="cantidad_producto">Cantidad:</label>
                    <input type="number" id="cantidad_producto" name="cantidad_producto" min="1" value="1" required>
                </div>

                <button type="submit" id="boton_guardar_producto" class="boton_exito">
                    Agregar a la Lista
                </button>

            </form>
        </section>

        <!-- Seccion de la tabla de registros acumulados -->
        <section class="seccion_tabla">
            <h2>Productos Registrados</h2>

            <div class="contenedor_tabla">
                <table id="tabla_productos">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Código</th>
                            <th>Cantidad</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo_tabla_productos">
                        <!-- Filas agregadas dinamicamente mediante JS -->
                    </tbody>
                </table>
            </div>

            <div class="acciones_exportacion">
                <button id="boton_generar_pdf" class="boton_pdf" disabled>
                    Descargar / Imprimir PDF
                </button>
            </div>
        </section>

    </main>

    <!-- Pie de pagina -->
    <footer class="pie_pagina">
        <p>&copy; 2026 - Sistema de Captura Seguro</p>
    </footer>

</body>
</html>
